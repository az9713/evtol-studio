<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/evtol-studio/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eVTOL Design Studio</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #0b0f14; font-family: "Segoe UI", system-ui, sans-serif; }
      #app { width: 100vw; height: 100vh; }
      .card {
        position: fixed; color: #e8eef7;
        background: rgba(20, 26, 34, 0.8); border: 1px solid #2a3444;
        border-radius: 8px; user-select: none;
      }
      #hud {
        top: 12px; left: 12px; font-size: 13px; line-height: 1.6; padding: 10px 14px;
      }
      #hud b { color: #22d3ee; }
      #hud .key { color: #8b9bb4; }
      #flight {
        top: 12px; right: 20px; padding: 10px 14px; min-width: 200px;
        font-size: 13px; line-height: 1.7; font-variant-numeric: tabular-nums;
      }
      #flight .label { color: #8b9bb4; }
      #flight .row { display: flex; justify-content: space-between; gap: 18px; }
      #flight .big { font-size: 26px; font-weight: 700; }
      #power {
        bottom: 16px; right: 20px; padding: 10px 16px; min-width: 200px;
        font-size: 13px; font-variant-numeric: tabular-nums;
      }
      #power .val { font-size: 30px; font-weight: 700; color: #22d3ee; }
      #power .val span { font-size: 14px; color: #8b9bb4; font-weight: 400; }
      #power .sub { color: #8b9bb4; font-size: 11px; line-height: 1.6; }
      #rotors {
        bottom: 16px; left: 20px; padding: 10px 12px;
        display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        font-size: 11px; text-align: center;
      }
      #rotors .r {
        width: 78px; padding: 5px 4px; border-radius: 6px;
        background: #1c2430; border: 1px solid #2a3444;
      }
      #rotors .r .n { color: #8b9bb4; font-size: 10px; }
      #rotors .r .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
      #rotors .r .w { height: 4px; background: #2a3444; border-radius: 2px; margin-top: 4px; overflow: hidden; }
      #rotors .r .w div { height: 100%; background: #22d3ee; width: 50%; }
      #rotors .title { grid-column: 1 / 3; color: #8b9bb4; }
      #warn { color: #fca5a5; }
    </style>
    <script type="module" crossorigin src="/evtol-studio/assets/index-Bd8KveNC.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="card">
      <div><b>eVTOL Design Studio</b> — Phase 1: rotor &amp; power</div>
      <div id="spec" class="key"></div>
      <div class="key">
        <span style="color:#e8eef7">W/S</span> pitch ·
        <span style="color:#e8eef7">A/D</span> roll ·
        <span style="color:#e8eef7">Q/E</span> yaw ·
        <span style="color:#e8eef7">Space/Shift</span> climb
      </div>
      <div class="key">
        <span style="color:#e8eef7">C</span> camera ·
        <span style="color:#e8eef7">T</span> thrust arrows ·
        <span style="color:#e8eef7">M</span> motors ·
        <span style="color:#e8eef7">R</span> reset
      </div>
      <div id="warn"></div>
    </div>

    <div id="flight" class="card">
      <div class="row"><span class="label">Altitude</span><span class="big" id="alt">0</span></div>
      <div class="row"><span class="label">Ground speed</span><span id="gs">0 km/h</span></div>
      <div class="row"><span class="label">Climb rate</span><span id="vs">0.0 m/s</span></div>
      <div class="row"><span class="label">Thrust / weight</span><span id="tw">1.00</span></div>
      <div class="row"><span class="label">Attitude</span><span id="att">0° / 0°</span></div>
      <div class="row"><span class="label">Camera</span><span id="cam">chase</span></div>
    </div>

    <div id="power" class="card">
      <div class="label" style="color:#8b9bb4; font-size:11px">ELECTRICAL POWER</div>
      <div class="val"><span id="kw">0</span> <span>kW</span></div>
      <div class="sub" id="power-sub"></div>
    </div>

    <div id="rotors" class="card">
      <div class="title">ROTOR RPM</div>
    </div>

  </body>
</html>
